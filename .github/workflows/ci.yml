name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: mensagens de commit (Conventional Commits)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD~1..HEAD"
          else
            range="$BEFORE..$SHA"
          fi
          devtools/scripts/check-commits.sh "$range"
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: shellcheck e actionlint
        run: |
          git ls-files -z '*.sh' 'devtools/githooks/*' | xargs -0 shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 && "$(go env GOPATH)/bin/actionlint"
      - name: testes dos scripts
        run: |
          scripts/test_dev.sh
          scripts/test_tag.sh
  sync:
    # As copias de regras, skills, hooks e scripts nos tres repositorios devem ser iguais a fonte daqui.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: psychoscope-github }
      - uses: actions/checkout@v7
        with: { repository: psychoscope-io/psychoscope-proto, path: psychoscope-proto }
      - uses: actions/checkout@v7
        with: { repository: psychoscope-io/psychoscope-core, path: psychoscope-core }
      - uses: actions/checkout@v7
        with: { repository: psychoscope-io/mod-net-sensor, path: mod-net-sensor }
      - run: psychoscope-github/scripts/sync-agent-rules.sh --check psychoscope-proto psychoscope-core mod-net-sensor
